<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book A Room | Amantran Guest House</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/scrollreveal"></script>
</head>

<body>

    <nav>
        <div class="logo">AMANTRAN</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="booking.html" class="active">Book Now</a></li>
            <li><a href="facilities.html">Facilities</a></li>
        </ul>
        <div class="burger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
    </nav>

    <header class="page-header"
        style="height: 40vh; background-image: url('https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&w=1500');">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Reserve Your Stay</h1>
            <p>Best Rates Guaranteed on Direct Booking</p>
        </div>
    </header>

    <section class="section container">

        <div class="booking-wrapper reveal-bottom">

            <div class="booking-form-side">
                <h2 style="margin-bottom: 20px; color: var(--primary);">Start Your Journey</h2>
                <form id="bookingForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" required placeholder="+91 XXXXX XXXXX">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Check-In</label>
                            <input type="date" id="checkin" required>
                        </div>
                        <div class="form-group">
                            <label>Check-Out</label>
                            <input type="date" id="checkout" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Room Type</label>
                            <select id="roomType">
                                <option value="Standard Non-AC">Standard Non-AC</option>
                                <option value="Deluxe AC">Deluxe AC</option>
                                <option value="Family Suite">Family Suite</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Guests</label>
                            <input type="number" id="guests" min="1" value="2">
                        </div>
                    </div>
                    <button type="submit" class="cta-btn full-width">Check Availability on WhatsApp</button>
                </form>
            </div>

            <div class="booking-image-side">
                <img src="https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf?auto=format&fit=crop&w=800&q=80"
                    alt="Luxury Bedroom Suite">
                <div class="image-text">
                    <h3>Relax & Unwind</h3>
                    <p>Experience the best comfort in Tarapith.</p>
                </div>
            </div>

        </div>
    </section>

    <footer>
        <p>&copy; 2026 Amantran Guest House. All Rights Reserved.</p>
        <p class="love">Made With Love ❤️</p>
    </footer>

    <script>
        document.getElementById('bookingForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const checkin = document.getElementById('checkin').value;
            const checkout = document.getElementById('checkout').value;
            const roomType = document.getElementById('roomType').value;
            const guests = document.getElementById('guests').value;
            const hotelNumber = "919999999999";
            const message = `*New Booking Request*%0A%0AName: ${name}%0APhone: ${phone}%0ACheck-In: ${checkin}%0ACheck-Out: ${checkout}%0ARoom: ${roomType}%0AGuests: ${guests}`;
            window.open(`https://wa.me/${hotelNumber}?text=${message}`, '_blank');
        });
    </script>
    <script src="script.js"></script>
</body>

</html>
